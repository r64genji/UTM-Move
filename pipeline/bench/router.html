<!doctype html>
<meta charset="utf-8" />
<title>router bench</title>
<script type="module">
  import { getRouter } from '/src/features/plan-trip/routerClient.ts'
  import { planQuery } from '/src/workers/routerApi.ts'
  import { decodeGraph } from '/src/domain/walk/graph.ts'
  import { loadTransit } from '/src/features/transit/useTransit.ts'
  window.runQuery = (q) => getRouter().planTrip(q)
  let direct
  window.runDirect = async (q) => {
    direct ??= Promise.all([fetch('/data/graph.bin').then(async (r) => decodeGraph(await r.arrayBuffer())), loadTransit()]).then(([graph, transit]) => ({ graph, transit, places: [] }))
    return planQuery(await direct, q)
  }
  window.ready = true
</script>
