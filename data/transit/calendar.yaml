# Service calendar for sessions 2025/2026 and 2026/2027, using the 2025/2026 bus times (carried over by user decision
# 2026-10-12 until UTM Fleet publishes the 2026/2027 timetable). All dates and times are Asia/Kuala_Lumpur.
#
# Sources:
# - Bus rules and times: Jadual-Shuttle-Kampus-Sesi-2025-2026.pdf (UTM Fleet, Jabatan TNC(P)), every weekday page:
#   "Bus services are not available on Saturday, Sunday, Public Holidays and during semester breaks."
#   "No service from 12:40 to 14:00 every FRIDAY". Effective from 6/10/2025 (times kept for 2026/2027).
# - Semester dates and public holidays: UTM Academic Calendar 2026/2027, Bachelor, Master and Doctoral
#   Programme, https://amd.utm.my/wp-content/uploads/sites/460/2026/05/Final_Kalendar-Akademik-Sarjana-Muda.Sarjana.Kedoktoran-20262027-14.5.2026-pembetulan.pdf
#   (linked from https://amd.utm.my/academic-calendar/). Holidays below are the ones that apply to the
#   Johor Bahru campus; "KL only" days (New Year 1 Jan, Federal Territory Day, Nuzul Al-Quran) are left out.
#   2025/2026 dates (first block of each list) come from the 2025/2026 calendar,
#   https://amd.utm.my/wp-content/uploads/sites/460/2025/12/POSTGRADUATE-2025-2026-02122026.pdf
#   The 2026/2027 calendar lists no Israk Mikraj holiday for Johor, so none is added.

timetableNote: Timetable from 2025/2026. Times may change.

session:
  start: 2025-10-06 # 2025/2026 timetable effective date
  # 2026/2027 starts 2026-10-05. Orientation week (Minggu Mesra Mahasiswa, 5-9 Oct 2026) counts as service days: new students are on campus.
  end: 2027-10-03 # last day of the 2026/2027 session (end of Semester II / short semester)

# Which weekdays each service runs.
services:
  weekday: [mon, tue, wed, thu, fri]
  tuesday: [tue]
  weekend: [sat, sun]

# Friday prayer gap: on Fridays, a weekday trip whose first-stop departure is at or after `from` and
# before `to` does not run. This matches the shaded "No service on Friday" rows on every PDF page
# (for example A1 runs at 14:00 on Friday, but not at 12:40 or 13:20).
fridayPrayerGap: { from: '12:40', to: '14:00' }

# No bus service on these days (all services). Weekend dates are kept so the list matches the PDF.
publicHolidays:
