# kind: final -> no bus service (the PDF's "semester breaks").
# kind: mid -> buses assumed to run (the PDF does not say; students stay on campus). See docs/v2/transit.md.
semesterBreaks:
  - { from: 2025-11-24, to: 2025-11-30, kind: mid, name: 'Mid-semester break, Semester I 2025/2026' }
  - { from: 2026-02-09, to: 2026-03-15, kind: final, name: 'Final break, Semester I 2025/2026' }
  - { from: 2026-05-04, to: 2026-05-10, kind: mid, name: 'Mid-semester break, Semester II 2025/2026' }
  - { from: 2026-07-20, to: 2026-10-04, kind: final, name: 'Final break, Semester II 2025/2026' }
  - { from: 2026-11-30, to: 2026-12-06, kind: mid, name: 'Mid-semester break, Semester I 2026/2027' }
  - { from: 2027-02-20, to: 2027-03-21, kind: final, name: 'Final break, Semester I 2026/2027' }
  - { from: 2027-05-17, to: 2027-05-23, kind: mid, name: 'Mid-semester break, Semester II 2026/2027' }
  - { from: 2027-07-26, to: 2027-10-03, kind: final, name: 'Final break, Semester II 2026/2027' }
